server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Next.js fingerprints these filenames, so they can be cached indefinitely.
    # Single Cache-Control header only — `expires` would emit a second, conflicting one.
    location /_next/static/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Static export layout: /transporte -> transporte.html, /foo/ -> foo/index.html.
    # Mirrors the clean-URL behaviour of `serve`, which `bun run start` uses locally.
    # Ends in =404 (not /404.html) so a miss returns a real 404 status; error_page
    # below then renders the page. Falling back to /404.html directly would serve
    # the error page with a 200.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
